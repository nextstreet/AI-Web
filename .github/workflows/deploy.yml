# 自动部署流水线：从 Payload 读取已发布内容，构建静态站点并同步到服务器。
# 触发：推送到 main、手动触发、Payload 发布后的 repository_dispatch（cms-published）。
#
# ══════════════ 首次启用配置（一次性）══════════════
#
# 1. 生成部署密钥（在本地电脑运行）：
#      ssh-keygen -t ed25519 -f deploy_key -N ""
#    把 deploy_key.pub 内容追加到服务器 ~/.ssh/authorized_keys，
#    deploy_key 私钥全文（包括 BEGIN/END 行）作为 DEPLOY_SSH_KEY。
#
# 2. GitHub 仓库 -> Settings -> Secrets and variables -> Actions，添加 Secrets：
#      DEPLOY_HOST      服务器 IP 或域名，如 1.2.3.4
#      DEPLOY_USER      SSH 用户名，如 root
#      DEPLOY_PATH      站点目录，如 /var/www/ai-seo-site（需已存在）
#      DEPLOY_SSH_KEY   上一步的私钥全文
#      DEPLOY_PORT      可选，默认 22
#      PUBLIC_SITE_URL  正式域名（含 https://），影响 sitemap 和 canonical
#      PAYLOAD_URL      Payload 的公网地址（含 https://），必须能被 GitHub Runner 访问
#      PAYLOAD_LOCALE   可选，默认 en
#
#    没有 PAYLOAD_URL 时构建会退回本地 Markdown，CMS 内容不会上线。
#    仅当确实想发布 Markdown 兜底站点时，设置仓库 Variable：
#      ALLOW_MARKDOWN_FALLBACK = true
#
# 3. 服务器 nginx：
#    - 静态站点：root 指向 DEPLOY_PATH
#    - CMS 路径分流（/admin /api /media -> 127.0.0.1:3000），并把
#      https://<域名>/api 暴露为 PAYLOAD_URL 的值
#
# 4. Payload 发布后自动重建（在服务器 apps/cms/.env 中配置）：
#      DEPLOY_HOOK_URL=https://api.github.com/repos/<owner>/<repo>/dispatches
#      DEPLOY_HOOK_TOKEN=<GitHub PAT，勾选 repo 权限>
#    发布/撤回页面、产品、分类或保存站点设置时，Payload 会自动触发本流水线。
#
# 密钥没配齐时部署步骤会自动跳过（黄字警告），构建照常执行。

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  repository_dispatch:
    types: [cms-published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查内容源配置
        env:
          PAYLOAD_URL: ${{ secrets.PAYLOAD_URL }}
          ALLOW_MARKDOWN_FALLBACK: ${{ vars.ALLOW_MARKDOWN_FALLBACK }}
        run: |
          if [ -z "$PAYLOAD_URL" ] && [ "$ALLOW_MARKDOWN_FALLBACK" != "true" ]; then
            echo "::error::缺少 PAYLOAD_URL secret，构建将退回本地 Markdown，CMS 内容无法上线。配置 Payload 公网地址后重试；如确实要发布 Markdown 兜底站点，请设置仓库变量 ALLOW_MARKDOWN_FALLBACK=true。"
            exit 1
          fi
          if [ -z "$PAYLOAD_URL" ]; then
            echo "::warning::PAYLOAD_URL 未配置，本次按本地 Markdown 兜底构建。"
          else
            echo "内容源：Payload ($PAYLOAD_URL)"
          fi

      - name: 构建站点
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          PAYLOAD_URL: ${{ secrets.PAYLOAD_URL }}
          PAYLOAD_LOCALE: ${{ secrets.PAYLOAD_LOCALE }}
        run: pnpm --filter @ai-seo/web build

      - name: 检查部署密钥
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::部署密钥未配齐（DEPLOY_HOST / DEPLOY_USER / DEPLOY_PATH / DEPLOY_SSH_KEY），本次跳过上传。配置方法见本文件头部注释。"
            exit 78
          fi

      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步到服务器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT:-22}" apps/web/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/index.html'" \
            && echo "部署完成：$DEPLOY_PATH/index.html 已更新"
