# CI 质量门禁：自用项目（apps/ 与 packages/）变更时运行 pnpm check。
# client-kit/ 客户交付套件目前没有构建步骤，其变更不会触发本工作流。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'client-kit/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'client-kit/**'
      - 'docs/**'
      - '**/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + Lint + 测试 + 构建
        run: pnpm check
